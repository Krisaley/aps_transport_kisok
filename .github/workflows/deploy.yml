name: Deploy production
on: {workflow_dispatch: {inputs: {release: {description: 'Commit SHA produced by CI', required: true, type: string}}}}
concurrency: {group: production, cancel-in-progress: false}
permissions: {contents: read, packages: read}
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with: {ssh-private-key: '${{ secrets.DEPLOY_SSH_KEY }}'}
      - run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - run: rsync -az --delete --exclude .env --exclude backups --exclude .deploy ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"
      - run: ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "cd '${{ secrets.DEPLOY_PATH }}' && APP_IMAGE=ghcr.io/${{ github.repository_owner }}/aps-transport-app WEB_IMAGE=ghcr.io/${{ github.repository_owner }}/aps-transport-web RELEASE_TAG='${{ inputs.release }}' sh scripts/deploy.sh"
