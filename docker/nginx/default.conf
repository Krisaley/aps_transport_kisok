server { listen 8080; server_name _; root /var/www/html/public; index index.php; client_max_body_size 25m; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; location / { try_files $uri $uri/ /index.php?$query_string; } location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param HTTP_PROXY ""; fastcgi_pass app:9000; fastcgi_read_timeout 120s; } location ~ /\. { deny all; } location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ { expires 7d; add_header Cache-Control "public, immutable"; try_files $uri /index.php?$query_string; } }
